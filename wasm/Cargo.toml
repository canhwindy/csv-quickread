[package]
name = "csvcore"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The byte-level CSV reader of csv-quickread, built to WebAssembly"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
